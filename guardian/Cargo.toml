[package]
name = "tauri-app-size-guardian"
version = "0.1.0"
edition = "2021"
description = "App Size Guardian — track binary size across builds, enforce size budgets, detect bloat"
license = "MIT"

[[bin]]
name = "guardian"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
glob = "0.3"

[workspace]

[dev-dependencies]
tempfile = "3"
