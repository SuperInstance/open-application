[package]
name = "tauri-app-size-guardian"
version = "0.2.0"
edition = "2021"
description = "App Size Guardian — track binary size across builds, enforce size budgets, detect bloat, analyze trends"
license = "MIT"
repository = "https://github.com/SuperInstance/tauri"
keywords = ["tauri", "binary-size", "bloat", "budget", "ci"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "guardian"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
glob = "0.3"
object = "0.36"
csv = "1.3"

[workspace]

[dev-dependencies]
tempfile = "3"
