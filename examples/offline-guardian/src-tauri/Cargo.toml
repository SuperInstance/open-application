[package]
name = "offline-guardian-example"
version = "0.1.0"
description = "Example Tauri app showcasing the Offline Guardian plugin"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0 OR MIT"

[lib]
name = "offline_guardian_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { path = "../../../crates/tauri-build", features = ["codegen"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[dependencies.tauri]
path = "../../../crates/tauri"
features = ["protocol-asset", "image-ico", "image-png"]

[dependencies.tauri-offline-guardian]
path = "../../../crates/tauri-offline-guardian"

[features]
prod = ["tauri/custom-protocol"]
