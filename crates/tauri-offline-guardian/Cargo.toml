[package]
name = "tauri-offline-guardian"
version = "0.1.0"
description = "Offline Guardian — Tauri apps that work offline, not break offline. Deadband-stabilized connectivity monitoring, device tiering, graceful escalation, and sync handoff."
authors.workspace = true
homepage = "https://github.com/SuperInstance/tauri"
repository = "https://github.com/SuperInstance/tauri"
categories.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
features = ["runtime"]

[features]
runtime = []

[dependencies]
tauri = { version = "2", path = "../tauri", default-features = false, features = [] }
tauri-plugin = { version = "2", path = "../tauri-plugin", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
thiserror = "1"
log = "0.4"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
